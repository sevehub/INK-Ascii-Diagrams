        <line x1="68" y1="56" x2="68" y2="136" class="solid"></line>
        <line x1="164" y1="56" x2="164" y2="136" class="solid"></line>
        <line x1="164" y1="88" x2="200" y2="88" class="solid"></line>
        <polygon points="200,84 208,88 200,92" class="filled"></polygon>
